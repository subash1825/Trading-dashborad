<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeLog — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0e1a;
      --surface:   #111827;
      --card:      #161d2e;
      --border:    #1e2d45;
      --accent:    #3b82f6;
      --accent2:   #06b6d4;
      --success:   #10b981;
      --danger:    #ef4444;
      --text:      #f0f4ff;
      --muted:     #6b7a99;
      --input-bg:  #0d1524;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      overflow-x: hidden;
    }

    /* ── background grid glow ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(6,182,212,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── logo / brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── card ── */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    /* ── tabs ── */
    .tabs {
      display: flex;
      background: var(--input-bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 32px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(59,130,246,0.35);
    }

    /* ── form panels ── */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ── field ── */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .field input::placeholder { color: #3a4a65; }

    /* ── password wrapper ── */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 17px;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--accent); }

    /* ── row ── */
    .field-row { display: flex; gap: 14px; }
    .field-row .field { flex: 1; margin-bottom: 18px; }

    /* ── submit btn ── */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }
    .submit-btn:hover { opacity: 0.9; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--border);
    }

    /* ── alert box ── */
    .alert {
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.5;
    }
    .alert.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
    .alert.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: block; }

    /* ── spinner ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── password strength ── */
    .strength-bar {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .strength-seg {
      flex: 1; height: 3px; border-radius: 3px;
      background: var(--border); transition: background 0.3s;
    }
    .strength-seg.weak   { background: #ef4444; }
    .strength-seg.medium { background: #f59e0b; }
    .strength-seg.strong { background: var(--success); }
    .strength-label {
      font-size: 11px; color: var(--muted);
      margin-top: 4px; text-align: right;
    }

    /* ── google btn ── */
    .google-btn {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .google-btn:hover {
      border-color: var(--accent);
      background: rgba(59,130,246,0.05);
    }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── footer ── */
    .auth-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .auth-footer a { color: var(--accent); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    /* ── responsive ── */
    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
      .field-row { flex-direction: column; gap: 0; }
      .brand { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-icon">📈</div>
    <span class="brand-name">TRADELOG</span>
  </div>

  <!-- Auth Card -->
  <div class="auth-card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div id="login-panel" class="form-panel active">
      <div class="form-title">Welcome back</div>
      <div class="form-sub">Sign in to access your trading journal.</div>

      <div id="login-alert" class="alert"></div>

      <div class="field">
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
          <button class="pw-toggle" onclick="togglePw('login-password', this)" tabindex="-1" title="Show / hide password">👁</button>
        </div>
      </div>

      <button class="submit-btn" id="login-btn" onclick="handleLogin()">Sign In</button>

      <div class="divider">or</div>

      <button class="google-btn" onclick="handleGoogle()">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.8 0 6.9 5.4 3 13.3l7.9 6.1C12.8 13.1 17.9 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.1z"/>
          <path fill="#FBBC05" d="M10.9 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L2.4 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8.3-6.1z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.7 2.2-7.6 2.2-6.1 0-11.2-3.6-13.1-9l-8.3 6.1C6.9 42.6 14.8 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <div style="text-align:center; font-size:13px; color:var(--muted); margin-top:18px;">
        Don't have an account?
        <a href="#" onclick="switchTab('signup'); return false;" style="color:var(--accent);">Create one free</a>
      </div>
    </div>

    <!-- ── SIGNUP PANEL ── -->
    <div id="signup-panel" class="form-panel">
      <div class="form-title">Create your account</div>
      <div class="form-sub">Start tracking your trades with full analytics and history.</div>

      <div id="signup-alert" class="alert"></div>

      <div class="field-row">
        <div class="field">
          <label for="signup-fname">First name</label>
          <input type="text" id="signup-fname" placeholder="John" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="signup-lname">Last name</label>
          <input type="text" id="signup-lname" placeholder="Doe" autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="signup-email">Email address</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="signup-password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="signup-password" placeholder="Min. 8 characters" autocomplete="new-password"
                 oninput="checkStrength(this.value)" />
          <button class="pw-toggle" onclick="togglePw('signup-password', this)" tabindex="-1" title="Show / hide password">👁</button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="signup-confirm" placeholder="Re-enter password" autocomplete="new-password" />
          <button class="pw-toggle" onclick="togglePw('signup-confirm', this)" tabindex="-1" title="Show / hide password">👁</button>
        </div>
      </div>

      <button class="submit-btn" id="signup-btn" onclick="handleSignup()">Create Account</button>

      <div class="divider">or</div>

      <button class="google-btn" onclick="handleGoogle()">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.8 0 6.9 5.4 3 13.3l7.9 6.1C12.8 13.1 17.9 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.1z"/>
          <path fill="#FBBC05" d="M10.9 28.6A14.8 14.8 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6L2.4 13.3A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8.3-6.1z"/>
          <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.7 2.2-7.6 2.2-6.1 0-11.2-3.6-13.1-9l-8.3 6.1C6.9 42.6 14.8 48 24 48z"/>
        </svg>
        Sign up with Google
      </button>
    </div>

  </div>

  <div class="auth-footer">
    &copy; 2025 TradeLog · <a href="#">Privacy</a> · <a href="#">Terms</a>
  </div>
</div>

<!-- ── Firebase ── -->
<script type="module">
  import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile, GoogleAuthProvider, signInWithPopup }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDkBtCC1K1g3IkSD9_IXhj2IWbp1doPDBk",
    authDomain:        "setharum-229f2.firebaseapp.com",
    projectId:         "setharum-229f2",
    storageBucket:     "setharum-229f2.firebasestorage.app",
    messagingSenderId: "679060524047",
    appId:             "1:679060524047:web:f9f4e06a1e600a0000277a"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // Redirect if already logged in
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = "dashboard.html";
  });

  /* ── LOGIN ── */
  window.handleLogin = async function () {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn      = document.getElementById('login-btn');
    const alert    = document.getElementById('login-alert');

    clearAlert('login-alert');
    if (!email || !password) { showAlert('login-alert', 'Please fill in all fields.', 'error'); return; }

    setLoading(btn, true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged will redirect
    } catch (e) {
      showAlert('login-alert', friendlyError(e.code), 'error');
      setLoading(btn, false);
    }
  };

  /* ── SIGNUP ── */
  window.handleSignup = async function () {
    const fname    = document.getElementById('signup-fname').value.trim();
    const lname    = document.getElementById('signup-lname').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm  = document.getElementById('signup-confirm').value;
    const btn      = document.getElementById('signup-btn');

    clearAlert('signup-alert');

    if (!fname || !lname || !email || !password || !confirm) {
      showAlert('signup-alert', 'Please fill in all fields.', 'error'); return;
    }
    if (password.length < 8) {
      showAlert('signup-alert', 'Password must be at least 8 characters.', 'error'); return;
    }
    if (password !== confirm) {
      showAlert('signup-alert', 'Passwords do not match.', 'error'); return;
    }

    setLoading(btn, true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: `${fname} ${lname}` });

      // Save user profile to Firestore
      await setDoc(doc(db, 'users', cred.user.uid), {
        uid:       cred.user.uid,
        firstName: fname,
        lastName:  lname,
        email:     email,
        role:      'user',
        createdAt: serverTimestamp(),
        lastLogin: serverTimestamp(),
        tradeCount: 0,
        accountBalance: 0
      });

      showAlert('signup-alert', 'Account created! Redirecting…', 'success');
      // onAuthStateChanged will redirect
    } catch (e) {
      showAlert('signup-alert', friendlyError(e.code), 'error');
      setLoading(btn, false);
    }
  };

  /* ── GOOGLE SIGN IN ── */
  window.handleGoogle = async function () {
    const provider = new GoogleAuthProvider();
    try {
      const cred = await signInWithPopup(auth, provider);
      const user = cred.user;
      // Save to Firestore if first time (merge so existing data isn't overwritten)
      const nameParts = (user.displayName || '').split(' ');
      await setDoc(doc(db, 'users', user.uid), {
        uid:       user.uid,
        firstName: nameParts[0] || '',
        lastName:  nameParts.slice(1).join(' ') || '',
        email:     user.email,
        role:      'user',
        photo:     user.photoURL || '',
        lastLogin: serverTimestamp(),
      }, { merge: true });
      // onAuthStateChanged handles redirect
    } catch (e) {
      const panel = document.getElementById('login-panel').classList.contains('active') ? 'login' : 'signup';
      showAlert(`${panel}-alert`, friendlyError(e.code), 'error');
    }
  };

  /* ── helpers ── */
  function setLoading(btn, on) {
    btn.disabled = on;
    btn.innerHTML = on
      ? `<span class="spinner"></span>Please wait…`
      : btn.id === 'login-btn' ? 'Sign In' : 'Create Account';
  }
  function showAlert(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert ${type}`;
  }
  function clearAlert(id) {
    const el = document.getElementById(id);
    el.className = 'alert';
    el.textContent = '';
  }
  function friendlyError(code) {
    const map = {
      'auth/user-not-found':       'No account found with this email.',
      'auth/wrong-password':        'Incorrect password. Try again.',
      'auth/invalid-credential':    'Email or password is incorrect.',
      'auth/email-already-in-use':  'An account with this email already exists.',
      'auth/weak-password':          'Password should be at least 6 characters.',
      'auth/invalid-email':          'Please enter a valid email address.',
      'auth/too-many-requests':      'Too many attempts. Please wait a moment and try again.',
      'auth/network-request-failed': 'Network error. Check your connection.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }
</script>

<!-- ── Non-Firebase UI helpers ── -->
<script>
  function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('login-panel').classList.toggle('active', isLogin);
    document.getElementById('signup-panel').classList.toggle('active', !isLogin);
    document.querySelectorAll('.tab-btn').forEach((b, i) =>
      b.classList.toggle('active', isLogin ? i === 0 : i === 1)
    );
  }

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  function checkStrength(val) {
    const segs  = [document.getElementById('s1'), document.getElementById('s2'),
                   document.getElementById('s3'), document.getElementById('s4')];
    const label = document.getElementById('strength-label');
    let score = 0;
    if (val.length >= 8)                   score++;
    if (/[A-Z]/.test(val))                 score++;
    if (/[0-9]/.test(val))                 score++;
    if (/[^A-Za-z0-9]/.test(val))          score++;

    const classes = ['', 'weak', 'medium', 'medium', 'strong'];
    const labels  = ['', 'Weak', 'Fair', 'Good', 'Strong'];
    segs.forEach((s, i) => {
      s.className = 'strength-seg' + (i < score ? ' ' + (score <= 1 ? 'weak' : score <= 3 ? 'medium' : 'strong') : '');
    });
    label.textContent = val.length ? labels[score] || 'Strong' : '';
    label.style.color = score <= 1 ? '#ef4444' : score <= 3 ? '#f59e0b' : '#10b981';
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('login-panel').classList.contains('active')) handleLogin();
      else handleSignup();
    }
  });
</script>
</body>
</html>
